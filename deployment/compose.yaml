services:
  engine:
    image: league-engine:current
    build: ./source
    restart: unless-stopped
    env_file: ./engine.env
    environment:
      PORT: "8765"
      LEAGUE_AUTO_START: "false"
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      LEAGUE_TRUST_PROXY: "true"
    mem_limit: 768m
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    stop_grace_period: 90s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    volumes:
      - ./state:/state
    ports:
      - "127.0.0.1:8765:8765"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8765/healthz',timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
  gateway:
    image: caddy:2-alpine
    restart: unless-stopped
    mem_limit: 128m
    pids_limit: 64
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      LEAGUE_DOMAIN: last-of-our-league-dedf75.indiasouthcentral.cloudapp.azure.com
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./caddy-data:/data
      - ./caddy-config:/config
    depends_on:
      engine:
        condition: service_healthy
